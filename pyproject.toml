[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcc"
version = "0.1.0"
description = "Are football pitch-control models calibrated probabilities? Evaluation harness and study code."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
loaders = ["kloppy>=3.15", "statsbombpy>=1.11"]
downstream = ["socceraction>=1.5"]
viz = ["mplsoccer>=1.2"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: end-to-end runs of the analysis scripts; deselect with -m 'not slow'",
]
