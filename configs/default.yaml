# =============================================================================
# Default configuration for the pitch-control calibration study.
#
# Every analyst choice that could change a reported number lives in this file
# and is hashed into each results manifest. Changing a value here and re-running
# produces a manifest whose config_sha256 differs, so two result sets can never
# be silently compared across different settings.
# =============================================================================

random_state: 20260911

# --- simulation (instrument validation only; never an empirical result) ------
simulation:
  n_matches: 10
  arrivals_per_match: 300

# --- preprocessing -----------------------------------------------------------
# These are the choices swept by scripts/07_ablations.py. The defaults are
# plausible, not measured; the ablation is what justifies reporting any of them.
preprocess:
  fps: 25.0
  smoothing_window_s: 0.4
  smoothing_polyorder: 2
  speed_cap: 12.0
  max_occlusion_gap_s: 0.5
  min_frame_completeness: 0.75
  max_sync_offset_s: 0.5
  min_pass_length_m: 3.0
  max_pass_length_m: 80.0
  min_flight_time_s: 0.1
  max_flight_time_s: 5.0
  exclude_set_pieces: true

# --- outcome definition ------------------------------------------------------
labels:
  definition: controlled_at_horizon   # primary; see pcc.data.labels
  horizon: 1.0                        # seconds
  censor_on_stoppage: true
  sensitivity_horizons: [0.25, 0.5, 1.0, 1.5, 2.0, 3.0]

# --- locomotion envelope -----------------------------------------------------
# Assumptions, not measurements. Ablated in scripts/07_ablations.py.
locomotion:
  v_max: 5.0
  a_max: 7.0
  reaction_time: 0.7
  sigma_tti: 0.45
  lambda_control: 4.3
  tti_model: bounded_accel            # or constant_speed (what published models use)

# --- models ------------------------------------------------------------------
models:
  suite:
    - M0_marginal
    - M1_voronoi
    - M2_physical
    - M2a_reach_sigmoid
    - M3_logistic
    - M4_gbm
  params:
    M2_physical:
      dt: 0.04
      t_max: 10.0
    M3_logistic:
      C: 1.0
    M4_gbm:
      max_iter: 400
      learning_rate: 0.05

# --- evaluation --------------------------------------------------------------
evaluation:
  split_group: match_id               # never a random row split; see pcc.evaluation.splits
  stratify_col: competition
  test_frac: 0.3
  valid_frac: 0.15
  n_bins: 15                          # secondary binned metrics only
  n_boot: 500                         # raise to >=1000 for anything reported
  bootstrap_level: 0.95
  cluster_col: match_id
  primary_metric: corp_mcb            # CORP miscalibration; NOT binned ECE
  primary_score: brier
  recalibrators: [identity, platt, isotonic, beta]
  min_subgroup_n: 200

# --- selection analysis ------------------------------------------------------
selection:
  candidates_per_arrival: 8
  proposal: reachable                 # uniform | reachable | perturb
  max_pass_length: 60.0
  trim_quantile: 0.99
  n_strata: 5
  gamma_grid: [1.0, 1.1, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]

# --- downstream --------------------------------------------------------------
downstream:
  loss_discounts: [0.2, 0.35, 0.5]
  decision_thresholds: [0.4, 0.5, 0.6, 0.7, 0.8]
  value_surface: fitted               # 'fitted' from data; never a hard-coded grid

# --- output ------------------------------------------------------------------
output:
  root: results
